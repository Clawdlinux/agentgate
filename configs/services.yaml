services:
  github:
    base_url: https://api.github.com
    auth:
      type: oauth2
      authorize_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      scopes: [repo, read:org, read:user]
    actions:
      list_repos:
        method: GET
        path: /user/repos
        params:
          type: "string?"
          sort: "string?"
          per_page: "int?"
      list_issues:
        method: GET
        path: /repos/{owner}/{repo}/issues
        params:
          owner: string
          repo: string
          state: "string?"
      create_issue:
        method: POST
        path: /repos/{owner}/{repo}/issues
        params:
          owner: string
          repo: string
          title: string
          body: "string?"
      list_pulls:
        method: GET
        path: /repos/{owner}/{repo}/pulls
        params:
          owner: string
          repo: string
          state: "string?"
  slack:
    base_url: https://slack.com/api
    auth:
      type: bearer
    actions:
      post_message:
        method: POST
        path: /chat.postMessage
        params:
          channel: string
          text: string
      list_channels:
        method: GET
        path: /conversations.list
        params:
          limit: "int?"
      list_users:
        method: GET
        path: /users.list
        params:
          limit: "int?"
      add_reaction:
        method: POST
        path: /reactions.add
        params:
          channel: string
          name: string
          timestamp: string
  stripe:
    base_url: https://api.stripe.com/v1
    auth:
      type: bearer
    actions:
      list_invoices:
        method: GET
        path: /invoices
        params:
          customer: "string?"
          limit: "int?"
      list_customers:
        method: GET
        path: /customers
        params:
          limit: "int?"
          email: "string?"
      create_charge:
        method: POST
        path: /charges
        params:
          amount: int
          currency: string
          source: "string?"
      get_balance:
        method: GET
        path: /balance
  google_workspace:
    base_url: https://gmail.googleapis.com
    auth:
      type: oauth2
      authorize_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      scopes: [https://www.googleapis.com/auth/gmail.labels]
    actions:
      list_labels:
        method: GET
        path: /gmail/v1/users/me/labels
  calendly:
    base_url: https://api.calendly.com
    auth:
      type: bearer
    actions:
      list_scheduled_events:
        method: GET
        path: /scheduled_events
        params:
          user: string
          count: "int?"
