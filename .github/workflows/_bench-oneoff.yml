name: Temporary benchmark (linux/amd64 percentile check)

# One-off workflow for github.com/Clawdlinux/agentgate/pull/20 - confirms the
# darwin/arm64 ledger-commit benchmark generalizes to linux/amd64, the
# platform that actually runs in production. Delete this file before merging
# #20; it is not meant to be a permanent part of CI.

on:
  push:
    branches:
      - spike/pure-go-sqlite

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run percentile harness 8x, pooled
        run: |
          mkdir -p /tmp/perf-samples
          for i in 1 2 3 4 5 6 7 8; do
            PERCENTILE_RAW_OUT="/tmp/perf-samples/run${i}.txt" \
              CGO_ENABLED=0 go test ./internal/receipt/ -run TestPercentileLedgerAppend -v -count=1
          done
      - name: Pooled p50/p90/p99 across 80,000 samples
        run: |
          python3 - <<'PY'
          import glob
          samples = []
          for f in sorted(glob.glob('/tmp/perf-samples/*.txt')):
              with open(f) as fh:
                  samples.extend(int(line.strip()) for line in fh if line.strip())
          samples.sort()
          n = len(samples)
          p50 = samples[n*50//100]
          p90 = samples[n*90//100]
          p99 = samples[n*99//100]
          mean = sum(samples)/n
          print(f"POOLED linux/amd64: n={n} mean={mean/1000:.1f}us p50={p50/1000:.1f}us p90={p90/1000:.1f}us p99={p99/1000:.1f}us")
          PY
