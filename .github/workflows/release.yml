name: Release

# github.com/Clawdlinux/agentgate/pull/20 replaced the CGO mattn/go-sqlite3
# driver with the pure-Go modernc.org/sqlite. With CGO_ENABLED=0, one
# ubuntu-latest runner can natively cross-compile every platform in
# .goreleaser.yaml's goos/goarch matrix -- no cross-gcc for arm64, no
# separate macos-latest job to build and `gh release upload` darwin binaries
# onto the same release afterwards.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

